name: backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres and Redis run as GitHub service containers (no Docker-in-Docker, no Testcontainers).
    # Tests and Alembic read the URLs below from the environment (be/app/config.py).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: papeto
          POSTGRES_PASSWORD: papeto
          POSTGRES_DB: papeto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papeto -d papeto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only throwaway credentials for the service containers above. Not secrets.
      DATABASE_URL: postgresql+asyncpg://papeto:papeto@localhost:5432/papeto_test
      REDIS_URL: redis://localhost:6379/0
      UV_PYTHON: "3.12"

    defaults:
      run:
        working-directory: be

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv (Python 3.12)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: be/uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Architecture boundaries (import-linter)
        run: uv run lint-imports

      - name: Apply migrations
        if: ${{ hashFiles('be/alembic.ini') != '' }}
        run: uv run alembic upgrade head

      - name: Tests (pytest)
        run: uv run pytest
