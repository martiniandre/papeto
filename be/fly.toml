# Fly.io config for the backend (São Paulo). Deploy from be/:  fly deploy
#
# Placeholder app name: replace it with the real one. Secrets are set with `fly secrets set`
# (JWT_SECRET, DATABASE_URL, REDIS_URL, provider keys) and never written here.
# DATABASE_URL must use the asyncpg driver: postgresql+asyncpg://...

app = "papeto-api-placeholder"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs once per deploy, before new machines start, from the same image.
  release_command = "alembic upgrade head"

[env]
  APP_ENV = "production"
  LOG_LEVEL = "INFO"
  WEB_CONCURRENCY = "2"

[processes]
  api = "gunicorn app.main:create_app() --worker-class uvicorn_worker.UvicornWorker --bind 0.0.0.0:8000 --graceful-timeout 30 --timeout 60"
  worker = "arq app.worker.settings.WorkerSettings"

[http_service]
  processes = ["api"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  processes = ["api"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "256mb"
