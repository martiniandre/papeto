[project]
name = "papeto-backend"
version = "0.1.0"
description = "Papeto backend (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "psycopg[binary]",
    "alembic",
    "structlog",
    "pillow",
    "arq",
    "redis",
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "import-linter",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "DTZ", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Take `now` from the Clock port instead."
"datetime.datetime.utcnow".msg = "Take `now` from the Clock port instead."
"datetime.date.today".msg = "Take `today_local` from the Clock port instead."

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
explicit_package_bases = true
exclude = ['(^|/)\.venv/']
warn_unreachable = true

[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain does not import frameworks or provider SDKs"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "asyncpg",
    "psycopg",
    "httpx",
    "redis",
    "arq",
    "PIL",
    "stripe",
    "pydantic_settings",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Domain does not import outer layers"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.api", "app.db", "app.providers", "app.services", "app.worker"]
